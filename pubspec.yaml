name: connectcall
description: "A new Flutter project."

publish_to: "none" 


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  dio: ^5.7.0

  
  cupertino_icons: ^1.0.9
  formz: ^0.8.1
  lottie: ^3.1.0
  flutter_hooks: ^0.21.3+1
  flutter_dotenv: ^5.2.1
  pinput: ^6.0.2
  google_fonts: ^8.2.1
  zego_uikit_prebuilt_call: ^4.24.4
  zego_uikit_signaling_plugin: ^2.8.21
  zego_zim: ^2.29.0+1
  image_picker: ^1.2.3
  intl: ^0.20.3
  zego_uikit: ^2.29.2
  connectivity_plus: ^6.1.5
  permission_handler: ^12.0.3
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  

 
  flutter_lints: ^6.0.0


flutter:
  
  uses-material-design: true
 
  assets:
    - assets/images/
    - assets/icons/
    - .env
    
 
flutter_launcher_icons:
  image_path: "assets/icons/app_lunch.png"
  android: true
  ios: false
  # Image format optimization options
  adaptive_icon_background: "#6c5ce7" 
  adaptive_icon_foreground: "assets/icons/app_lunch.png"
  
